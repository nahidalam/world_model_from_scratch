<polygon points="926,296 915.4842419554554,293.6721613568381 916.779734765563,301.56657066843064" fill="#68778b"/>
<text x="731.0" y="319.0" font-size="13" fill="#46566b" font-weight="400" text-anchor="middle">goal features</text>
<path d="M866 168L926 220" stroke="#68778b" stroke-width="2" fill="none"/>
<polygon points="926,220 921.0628313257731,210.42793828466233 915.8233870184305,216.47345094698085" fill="#68778b"/>
<text x="896.0" y="185.0" font-size="13" fill="#46566b" font-weight="400" text-anchor="middle">predicted features</text>
<path d="M1007 187 L1007 78 L731 78 L731 98" stroke="#68778b" stroke-width="2" fill="none"/>
<polygon points="731,98 735.0,88.0 727.0,88.0" fill="#68778b"/>
<text x="870" y="69" font-size="13" fill="#46566b" font-weight="400" text-anchor="middle">candidate actions</text>
<rect x="32" y="479" width="320" height="75" rx="11" fill="#fff" stroke="#c3cfdd" stroke-width="1.6"/>
<text x="192.0" y="508" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Offline training</text>
<text x="192.0" y="535" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">feature prediction loss</text>
<rect x="400" y="479" width="320" height="75" rx="11" fill="#fff" stroke="#c3cfdd" stroke-width="1.6"/>
<text x="560.0" y="508" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Test-time objective</text>
<text x="560.0" y="535" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">predicted goal-feature distance</text>
<rect x="768" y="479" width="320" height="75" rx="11" fill="#fff" stroke="#c3cfdd" stroke-width="1.6"/>
<text x="928.0" y="508" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Execution</text>
<text x="928.0" y="535" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">apply first action, observe, replan</text>
</g></svg>
