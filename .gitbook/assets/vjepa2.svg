<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc">
<title id="title">V-JEPA 2 and V-JEPA 2-AC: two training stages</title>
<desc id="desc">Stage one trains a video encoder by matching masked predictions to an EMA target encoder. Stage two freezes the encoder and trains an action-conditioned predictor. CEM selects robot actions by comparing predicted and goal features.</desc>
<rect width="1120" height="900" rx="16" fill="#f7f9fc"/>
<g font-family="system-ui, -apple-system, sans-serif">
<text x="32" y="42" font-size="24" fill="#14243b" font-weight="650" text-anchor="start">V-JEPA 2 and V-JEPA 2-AC: two training stages</text>
<text x="32" y="73" font-size="15" fill="#46566b" font-weight="400" text-anchor="start">Stage 1 learns visual state from video. Stage 2 learns how robot actions change that state.</text>
<text x="32" y="111" font-size="14" fill="#2677d4" font-weight="700" text-anchor="start">STAGE 1 · ACTION-FREE VIDEO PRETRAINING</text>
<rect x="32" y="132" width="174" height="102" rx="11" fill="#fff" stroke="#c3cfdd" stroke-width="1.6"/>
<text x="119.0" y="161" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Masked clip</text>
<text x="119.0" y="188" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">visible tubelets</text>
<text x="119.0" y="210" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">2 × 16 × 16</text>
<rect x="32" y="278" width="174" height="102" rx="11" fill="#fff" stroke="#c3cfdd" stroke-width="1.6"/>
<text x="119.0" y="307" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Full clip</text>
<text x="119.0" y="334" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">all tubelets</text>
<rect x="252" y="125" width="220" height="116" rx="11" fill="#e5f0fd" stroke="#2677d4" stroke-width="1.6"/>
<text x="362.0" y="154" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Context ViT-g/16</text>
<text x="362.0" y="181" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">visible representations</text>
<text x="362.0" y="203" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">updated by gradient</text>
<rect x="252" y="271" width="220" height="116" rx="11" fill="#e5f0fd" stroke="#2677d4" stroke-width="1.6"/>
<text x="362.0" y="300" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">EMA target ViT-g/16</text>
<text x="362.0" y="327" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">hidden target features</text>
<text x="362.0" y="349" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">updated by moving average</text>
<rect x="536" y="125" width="244" height="126" rx="11" fill="#f0eafd" stroke="#7654c4" stroke-width="1.6"/>
<text x="658.0" y="154" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Small predictor</text>
<text x="658.0" y="181" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">context + mask tokens</text>
<text x="658.0" y="203" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">predict hidden features</text>
<text x="658.0" y="225" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">12 blocks · width 384</text>
<rect x="850" y="196" width="226" height="112" rx="11" fill="#e8f5ec" stroke="#328554" stroke-width="1.6"/>
<text x="963.0" y="225" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Masked L1 loss</text>
<text x="963.0" y="252" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">prediction ↔ target</text>
<text x="963.0" y="274" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">train context + predictor</text>
