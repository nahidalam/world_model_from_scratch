<polygon points="850,232 843.6623206887633,223.2917383509725 839.4049483270165,230.06483074466055" fill="#68778b"/>
<text x="815.0" y="201.0" font-size="13" fill="#46566b" font-weight="400" text-anchor="middle">prediction</text>
<path d="M472 329L850 275" stroke="#68778b" stroke-width="2" fill="none"/>
<polygon points="850,275 839.5348196384391,272.4544155877284 840.6661904883376,280.3740115370178" fill="#68778b"/>
<text x="661.0" y="293.0" font-size="13" fill="#46566b" font-weight="400" text-anchor="middle">EMA target</text>
<path d="M362 241L362 271" stroke="#68778b" stroke-width="2" fill="none"/>
<polygon points="362,271 366.0,261.0 358.0,261.0" fill="#68778b"/>
<text x="362.0" y="247.0" font-size="13" fill="#46566b" font-weight="400" text-anchor="middle">EMA</text>
<path d="M32 428L1088 428" stroke="#c3cfdd" stroke-width="1.5"/>
<text x="32" y="462" font-size="14" fill="#7654c4" font-weight="700" text-anchor="start">STAGE 2 · ACTION-CONDITIONED ROBOT POST-TRAINING</text>
<rect x="32" y="493" width="174" height="96" rx="11" fill="#fff" stroke="#c3cfdd" stroke-width="1.6"/>
<text x="119.0" y="522" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Current frame</text>
<text x="119.0" y="549" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">robot camera image</text>
<rect x="32" y="695" width="174" height="96" rx="11" fill="#fff" stroke="#c3cfdd" stroke-width="1.6"/>
<text x="119.0" y="724" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Goal frame</text>
<text x="119.0" y="751" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">desired final view</text>
<rect x="250" y="482" width="216" height="118" rx="11" fill="#e5f0fd" stroke="#2677d4" stroke-width="1.6"/>
<text x="358.0" y="511" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Frozen ViT-g/16</text>
<text x="358.0" y="538" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">per-frame encoding</text>
<text x="358.0" y="560" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">16 × 16 × 1,408</text>
<rect x="250" y="684" width="216" height="118" rx="11" fill="#e5f0fd" stroke="#2677d4" stroke-width="1.6"/>
<text x="358.0" y="713" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Same frozen encoder</text>
<text x="358.0" y="740" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">goal feature map</text>
<rect x="526" y="480" width="270" height="138" rx="11" fill="#f0eafd" stroke="#7654c4" stroke-width="1.6"/>
<text x="661.0" y="509" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">V-JEPA 2-AC predictor</text>
<text x="661.0" y="536" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">24 blocks · width 1,024</text>
<text x="661.0" y="558" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">256 visual + state + action</text>
<text x="661.0" y="580" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">predict next feature map</text>
<rect x="526" y="684" width="270" height="118" rx="11" fill="#fdece4" stroke="#d45b2d" stroke-width="1.6"/>
<text x="661.0" y="713" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Robot inputs</text>
<text x="661.0" y="740" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">7D end-effector state</text>
<text x="661.0" y="762" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">7D candidate actions</text>
<rect x="856" y="528" width="220" height="126" rx="11" fill="#e8f5ec" stroke="#328554" stroke-width="1.6"/>
<text x="966.0" y="557" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">L1 energy + CEM</text>
<text x="966.0" y="584" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">compare terminal features</text>
<text x="966.0" y="606" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">keep low-energy actions</text>
<text x="966.0" y="628" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">execute one, then replan</text>
