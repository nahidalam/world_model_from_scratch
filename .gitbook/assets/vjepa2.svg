<polygon points="856,573 848.2007957965639,565.572186472918 845.229670385731,573.0" fill="#68778b"/>
<text x="826.0" y="552.0" font-size="13" fill="#46566b" font-weight="400" text-anchor="middle">predicted future</text>
<path d="M661 684L661 618" stroke="#68778b" stroke-width="2" fill="none"/>
<polygon points="661,618 657.0,628.0 665.0,628.0" fill="#68778b"/>
<text x="32" y="861" font-size="15" fill="#46566b" font-weight="400" text-anchor="start">The pretrained video encoder stays frozen during Stage 2; only the action-conditioned predictor learns from robot trajectories.</text>
</g></svg>
