<text x="32" y="73" font-size="15" fill="#46566b" font-weight="650" text-anchor="start">The shared Dreamer loop</text>
<rect x="32" y="92" width="190" height="94" rx="11" fill="#e5f0fd" stroke="#2677d4" stroke-width="1.6"/>
<text x="127.0" y="121" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Replay state</text>
<text x="127.0" y="148" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">posterior or</text>
<text x="127.0" y="170" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">recorded context</text>
<rect x="270" y="92" width="210" height="94" rx="11" fill="#f0eafd" stroke="#7654c4" stroke-width="1.6"/>
<text x="375.0" y="121" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Imagine actions</text>
<text x="375.0" y="148" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">predict state + reward</text>
<text x="375.0" y="170" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">optional episode end</text>
<rect x="528" y="92" width="190" height="94" rx="11" fill="#fdece4" stroke="#d45b2d" stroke-width="1.6"/>
<text x="623.0" y="121" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Build returns</text>
<text x="623.0" y="148" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">bootstrap with value</text>
<text x="623.0" y="170" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">λ-return recursion</text>
<rect x="766" y="92" width="322" height="94" rx="11" fill="#e8f5ec" stroke="#328554" stroke-width="1.6"/>
<text x="927.0" y="121" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Improve behavior</text>
<text x="927.0" y="148" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">update policy and value</text>
<text x="927.0" y="170" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">execute policy in the task</text>
