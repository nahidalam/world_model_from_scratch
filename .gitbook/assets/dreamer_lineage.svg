<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="930" viewBox="0 0 1120 930" role="img" aria-labelledby="title desc">
<title id="title">From PlaNet to Dreamer 4</title>
<desc id="desc">PlaNet supplies the recurrent state-space model. Dreamer 1 learns an actor and value function in imagination, Dreamer 2 introduces categorical latent states, Dreamer 3 stabilizes training across domains, and Dreamer 4 replaces the RSSM with a causal video Transformer while keeping imagination training.</desc>
