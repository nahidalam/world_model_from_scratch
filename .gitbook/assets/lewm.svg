<polygon points="602,668 598.0,678.0 606.0,678.0" fill="#68778b"/>
<text x="822" y="748" font-size="13" fill="#46566b" font-weight="400" text-anchor="middle">update candidate distribution</text>
<rect x="32" y="782" width="320" height="70" rx="11" fill="#fff" stroke="#c3cfdd" stroke-width="1.6"/>
<text x="192.0" y="811" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">State</text>
<text x="192.0" y="838" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">single projected 192D CLS embedding</text>
<rect x="400" y="782" width="320" height="70" rx="11" fill="#fff" stroke="#c3cfdd" stroke-width="1.6"/>
<text x="560.0" y="811" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Prediction</text>
<text x="560.0" y="838" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">deterministic next embedding</text>
<rect x="768" y="782" width="320" height="70" rx="11" fill="#fff" stroke="#c3cfdd" stroke-width="1.6"/>
<text x="928.0" y="811" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Decision</text>
<text x="928.0" y="838" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">execute 5 steps, observe, replan</text>
