<polygon points="748,595 738.0,591.0 738.0,599.0" fill="#68778b"/>
<text x="724.0" y="586.0" font-size="13" fill="#46566b" font-weight="400" text-anchor="middle">actions</text>
<path d="M944 595L992 595" stroke="#68778b" stroke-width="2" fill="none"/>
<polygon points="992,595 982.0,591.0 982.0,599.0" fill="#68778b"/>
