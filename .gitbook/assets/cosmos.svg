<polygon points="518,82 508.0,78.0 508.0,86.0" fill="#68778b"/>
<rect x="826" y="32" width="262" height="70" rx="11" fill="#fff" stroke="#c3cfdd" stroke-width="1.6"/>
<text x="957.0" y="61" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Prompt</text>
<text x="957.0" y="88" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">describe the scene and motion</text>
<rect x="826" y="150" width="262" height="105" rx="11" fill="#fdece4" stroke="#d45b2d" stroke-width="1.6"/>
<text x="957.0" y="179" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Cosmos-Reason1</text>
<text x="957.0" y="206" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">text encoder</text>
<text x="957.0" y="228" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">provides text features</text>
<path d="M957 102L957 150" stroke="#68778b" stroke-width="2" fill="none"/>
<polygon points="957,150 961.0,140.0 953.0,140.0" fill="#68778b"/>
<rect x="32" y="340" width="225" height="135" rx="11" fill="#e5f0fd" stroke="#2677d4" stroke-width="1.6"/>
<text x="144.5" y="369" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Video latents</text>
<text x="144.5" y="396" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">sampled noise</text>
<text x="144.5" y="418" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">observed prefix and mask</text>
<rect x="300" y="350" width="215" height="115" rx="11" fill="#e5f0fd" stroke="#2677d4" stroke-width="1.6"/>
<text x="407.5" y="379" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Patch embedding</text>
<text x="407.5" y="406" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">small spatial patches</text>
<text x="407.5" y="428" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">1 × 2 × 2</text>
<rect x="558" y="325" width="296" height="180" rx="11" fill="#f0eafd" stroke="#7654c4" stroke-width="1.6"/>
<text x="706.0" y="354" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Diffusion Transformer</text>
<text x="706.0" y="381" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">28 blocks in the released 2B</text>
<text x="706.0" y="403" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">video self-attention</text>
<text x="706.0" y="425" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">text cross-attention</text>
<text x="706.0" y="447" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">feed-forward network</text>
