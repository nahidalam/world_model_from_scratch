<g font-family="system-ui, -apple-system, sans-serif">
<rect x="32" y="32" width="180" height="100" rx="11" fill="#fff" stroke="#c3cfdd" stroke-width="1.6"/>
<text x="122.0" y="61" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Observation</text>
<text x="122.0" y="88" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">optional image or video</text>
