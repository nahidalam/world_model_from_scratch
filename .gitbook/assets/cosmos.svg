<text x="365.0" y="61" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Wan2.1 VAE encoder</text>
<text x="365.0" y="88" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">compress video frames</text>
<rect x="518" y="32" width="210" height="100" rx="11" fill="#e5f0fd" stroke="#2677d4" stroke-width="1.6"/>
<text x="623.0" y="61" font-size="17" fill="#14243b" font-weight="650" text-anchor="middle">Observed latents</text>
<text x="623.0" y="88" font-size="14" fill="#46566b" font-weight="400" text-anchor="middle">condition the continuation</text>
