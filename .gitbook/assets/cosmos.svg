<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="694" viewBox="0 0 1120 694" role="img" aria-labelledby="title desc">
<title id="title">Cosmos-Predict2.5 architecture</title>
<desc id="desc">An optional image or video is encoded by the Wan2.1 VAE into observed latents. A prompt is encoded by Cosmos-Reason1 for text cross-attention. Noisy video latents, the observed prefix, and a condition mask pass through patch embedding and the released 2B model&#x27;s 28-block diffusion Transformer. The Transformer uses video self-attention, text cross-attention, and noise-level conditioning to predict latent velocity. A sampler repeatedly updates the latents before the VAE decoder produces the video.</desc>
