<polygon points="576,818 566.0,814.0 566.0,822.0" fill="#68778b"/>
<path d="M796 818L828 818" stroke="#68778b" stroke-width="2" fill="none"/>
<polygon points="828,818 818.0,814.0 818.0,822.0" fill="#68778b"/>
<text x="32" y="934" font-size="14" fill="#46566b" font-weight="400" text-anchor="start">Reported experiment: 124 frames conditioned on one complete 37-action schedule.</text>
</g></svg>
