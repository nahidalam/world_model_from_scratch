<text x="1075.0" y="169.5" font-size="17" fill="#14243b" font-weight="600" text-anchor="middle">Output</text>
<text x="1075.0" y="194.5" font-size="14" fill="#42536a" font-weight="400" text-anchor="middle">weights × V</text>
</g></svg>
