<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="300" viewBox="0 0 1160 300" role="img" aria-labelledby="title desc">
<title id="title">One attention head</title><desc id="desc">Video tokens are projected into queries, keys, and values. Queries and keys are normalized and rotated by position, compared to give scores, and passed through softmax to give weights. The weights combine the values into output tokens.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#53637a"/></marker></defs>
<rect width="1160" height="300" rx="16" fill="#f7f9fc"/>
<g font-family="system-ui, sans-serif">
<rect x="20" y="110" width="150" height="100" rx="10" fill="#fff" stroke="#c2cedc" stroke-width="1.5"/>
<text x="95.0" y="154.5" font-size="17" fill="#14243b" font-weight="600" text-anchor="middle">Video tokens</text>
<text x="95.0" y="179.5" font-size="14" fill="#42536a" font-weight="400" text-anchor="middle">one per patch</text>
<path d="M170 160H190V70H199" fill="none" stroke="#53637a" stroke-width="2"/>
<polygon points="199.0,70.0 190.0,66.0 190.0,74.0" fill="#53637a"/>
