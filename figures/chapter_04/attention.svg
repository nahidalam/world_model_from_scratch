<polygon points="199.0,150.0 190.0,146.0 190.0,154.0" fill="#53637a"/>
<path d="M170 160H190V250H199" fill="none" stroke="#53637a" stroke-width="2"/>
<polygon points="199.0,250.0 190.0,246.0 190.0,254.0" fill="#53637a"/>
<rect x="210" y="40" width="110" height="60" rx="10" fill="#fff" stroke="#c2cedc" stroke-width="1.5"/>
<text x="265.0" y="76.0" font-size="17" fill="#14243b" font-weight="600" text-anchor="middle">Query</text>
<rect x="210" y="120" width="110" height="60" rx="10" fill="#fff" stroke="#c2cedc" stroke-width="1.5"/>
<text x="265.0" y="156.0" font-size="17" fill="#14243b" font-weight="600" text-anchor="middle">Key</text>
<rect x="210" y="220" width="110" height="60" rx="10" fill="#fff" stroke="#c2cedc" stroke-width="1.5"/>
<text x="265.0" y="256.0" font-size="17" fill="#14243b" font-weight="600" text-anchor="middle">Value</text>
<path d="M320 70H349" fill="none" stroke="#53637a" stroke-width="2"/>
<polygon points="349.0,70.0 340.0,66.0 340.0,74.0" fill="#53637a"/>
<path d="M320 150H349" fill="none" stroke="#53637a" stroke-width="2"/>
<polygon points="349.0,150.0 340.0,146.0 340.0,154.0" fill="#53637a"/>
<rect x="360" y="40" width="200" height="140" rx="10" fill="#fff" stroke="#14243b" stroke-width="1.5"/>
<text x="460.0" y="81.5" font-size="17" fill="#14243b" font-weight="600" text-anchor="middle">Prepare Q and K</text>
<text x="460.0" y="106.5" font-size="14" fill="#42536a" font-weight="400" text-anchor="middle">RMS normalize</text>
<text x="460.0" y="129.5" font-size="14" fill="#42536a" font-weight="400" text-anchor="middle">rotate by position</text>
<text x="460.0" y="152.5" font-size="14" fill="#42536a" font-weight="400" text-anchor="middle">(RoPE)</text>
<path d="M560 110H589" fill="none" stroke="#53637a" stroke-width="2"/>
<polygon points="589.0,110.0 580.0,106.0 580.0,114.0" fill="#53637a"/>
<rect x="600" y="70" width="170" height="80" rx="10" fill="#fff" stroke="#c2cedc" stroke-width="1.5"/>
<text x="685.0" y="104.5" font-size="17" fill="#14243b" font-weight="600" text-anchor="middle">Scores</text>
<text x="685.0" y="129.5" font-size="14" fill="#42536a" font-weight="400" text-anchor="middle">QKᵀ / √d</text>
<path d="M770 110H799" fill="none" stroke="#53637a" stroke-width="2"/>
<polygon points="799.0,110.0 790.0,106.0 790.0,114.0" fill="#53637a"/>
<rect x="810" y="70" width="160" height="80" rx="10" fill="#fff" stroke="#c2cedc" stroke-width="1.5"/>
<text x="890.0" y="104.5" font-size="17" fill="#14243b" font-weight="600" text-anchor="middle">Weights</text>
<text x="890.0" y="129.5" font-size="14" fill="#42536a" font-weight="400" text-anchor="middle">softmax per row</text>
