<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc">
<title id="title">One Transformer block</title><desc id="desc">Tokens pass through self-attention, cross-attention, and a feed-forward network. Each sublayer applies adaptive normalization and a gated residual addition. The noise level t becomes a timestep embedding that sets each sublayer&#x27;s shift, scale, and gate. The learned context enters through cross-attention.</desc>
