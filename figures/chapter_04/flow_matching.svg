<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">Flow matching</title><desc id="desc">Training mixes a clean latent and noise at level t, and the Transformer&#x27;s predicted velocity is compared with noise minus the clean latent. Generation starts from noise; the Transformer predicts a velocity, the latent takes a small step toward t equals zero, and the loop repeats until the generated latent remains.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#53637a"/></marker></defs>
<rect width="1000" height="360" rx="16" fill="#f7f9fc"/>
<g font-family="system-ui, sans-serif">
<rect x="20" y="20" width="190" height="70" rx="10" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="115.0" y="49.5" font-size="17" fill="#14243b" font-weight="600" text-anchor="middle">Clean latent z</text>
<text x="115.0" y="74.5" font-size="14" fill="#42536a" font-weight="400" text-anchor="middle">t = 0</text>
<rect x="20" y="110" width="190" height="70" rx="10" fill="#fdece4" stroke="#d85c2c" stroke-width="1.5"/>
<text x="115.0" y="139.5" font-size="17" fill="#14243b" font-weight="600" text-anchor="middle">Noise ε</text>
<text x="115.0" y="164.5" font-size="14" fill="#42536a" font-weight="400" text-anchor="middle">t = 1</text>
<path d="M210 55H225V100H239" fill="none" stroke="#53637a" stroke-width="2"/>
<polygon points="239.0,100.0 230.0,96.0 230.0,104.0" fill="#53637a"/>
<path d="M210 145H225V100H239" fill="none" stroke="#53637a" stroke-width="2"/>
<polygon points="239.0,100.0 230.0,96.0 230.0,104.0" fill="#53637a"/>
<rect x="250" y="60" width="230" height="80" rx="10" fill="#fff" stroke="#c2cedc" stroke-width="1.5"/>
<text x="365.0" y="94.5" font-size="17" fill="#14243b" font-weight="600" text-anchor="middle">Mix at level t</text>
<text x="365.0" y="119.5" font-size="14" fill="#42536a" font-weight="400" text-anchor="middle">(1 − t)z + tε</text>
<path d="M480 100H509" fill="none" stroke="#53637a" stroke-width="2"/>
<polygon points="509.0,100.0 500.0,96.0 500.0,104.0" fill="#53637a"/>
<rect x="520" y="60" width="190" height="80" rx="10" fill="#fff" stroke="#14243b" stroke-width="1.5"/>
<text x="615.0" y="94.5" font-size="17" fill="#14243b" font-weight="600" text-anchor="middle">Transformer</text>
<text x="615.0" y="119.5" font-size="14" fill="#42536a" font-weight="400" text-anchor="middle">predicts velocity</text>
<path d="M710 100H739" fill="none" stroke="#53637a" stroke-width="2"/>
<polygon points="739.0,100.0 730.0,96.0 730.0,104.0" fill="#53637a"/>
<rect x="750" y="60" width="230" height="80" rx="10" fill="#fff" stroke="#c2cedc" stroke-width="1.5"/>
<text x="865.0" y="94.5" font-size="17" fill="#14243b" font-weight="600" text-anchor="middle">Loss</text>
<text x="865.0" y="119.5" font-size="14" fill="#42536a" font-weight="400" text-anchor="middle">prediction vs. ε − z</text>
<rect x="20" y="230" width="190" height="80" rx="10" fill="#fdece4" stroke="#d85c2c" stroke-width="1.5"/>
<text x="115.0" y="264.5" font-size="17" fill="#14243b" font-weight="600" text-anchor="middle">Noise ε</text>
<text x="115.0" y="289.5" font-size="14" fill="#42536a" font-weight="400" text-anchor="middle">t = 1</text>
<path d="M210 270H239" fill="none" stroke="#53637a" stroke-width="2"/>
<polygon points="239.0,270.0 230.0,266.0 230.0,274.0" fill="#53637a"/>
<rect x="250" y="230" width="230" height="80" rx="10" fill="#fff" stroke="#14243b" stroke-width="1.5"/>
<text x="365.0" y="264.5" font-size="17" fill="#14243b" font-weight="600" text-anchor="middle">Transformer</text>
<text x="365.0" y="289.5" font-size="14" fill="#42536a" font-weight="400" text-anchor="middle">predicts velocity</text>
<path d="M480 270H509" fill="none" stroke="#53637a" stroke-width="2"/>
<polygon points="509.0,270.0 500.0,266.0 500.0,274.0" fill="#53637a"/>
<rect x="520" y="230" width="190" height="80" rx="10" fill="#fff" stroke="#c2cedc" stroke-width="1.5"/>
<text x="615.0" y="264.5" font-size="17" fill="#14243b" font-weight="600" text-anchor="middle">Update latent</text>
<text x="615.0" y="289.5" font-size="14" fill="#42536a" font-weight="400" text-anchor="middle">small step toward t = 0</text>
<path d="M615 310V335H365V321" fill="none" stroke="#53637a" stroke-width="2"/>
<polygon points="365.0,321.0 361.0,330.0 369.0,330.0" fill="#53637a"/>
<path d="M710 270H739" fill="none" stroke="#53637a" stroke-width="2"/>
<polygon points="739.0,270.0 730.0,266.0 730.0,274.0" fill="#53637a"/>
<rect x="750" y="230" width="230" height="80" rx="10" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="865.0" y="264.5" font-size="17" fill="#14243b" font-weight="600" text-anchor="middle">Generated latent</text>
<text x="865.0" y="289.5" font-size="14" fill="#42536a" font-weight="400" text-anchor="middle">t = 0</text>
</g></svg>
