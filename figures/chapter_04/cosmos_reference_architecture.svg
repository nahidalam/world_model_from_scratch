<title id="title">Inside Cosmos-Predict2.5-2B</title><desc id="desc">The observed video passes through the pretrained VAE encoder into a latent with observed and noise frames. A pretrained text encoder turns the prompt into features that the 28-block Transformer reads. The Transformer and sampler repeat until t equals zero, and the pretrained VAE decoder produces the video.</desc>
