<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="260" viewBox="0 0 1080 260" role="img" aria-labelledby="title desc">
  <title id="title">High level architecture in DreamerV1–V3</title>
  <desc id="desc">DreamerV1 through V3 share an RSSM imagination loop. The stochastic latent state z_t is Gaussian in V1 and categorical in V2 and V3. V3 improves training stability.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#52677f"/>
    </marker>
  </defs>
  <rect width="1080" height="260" rx="16" fill="#f7f9fc"/>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#14243b">
    <text x="36" y="43" font-size="24" font-weight="650">High level architecture in DreamerV1–V3</text>

    <rect x="36" y="79" width="210" height="132" rx="12" fill="#e5f0fd" stroke="#2677d4" stroke-width="2"/>
    <text x="141" y="130" text-anchor="middle" font-size="18" font-weight="650">Experience</text>
    <text x="141" y="162" text-anchor="middle" font-size="15" fill="#46566b">observations, actions</text>

    <rect x="301" y="79" width="210" height="132" rx="12" fill="#f0eafd" stroke="#7654c4" stroke-width="2"/>
    <text x="406" y="112" text-anchor="middle" font-size="18" font-weight="650">RSSM latent state</text>
    <text x="406" y="141" text-anchor="middle" font-size="15" fill="#46566b">hₜ: recurrent memory</text>
    <text x="406" y="166" text-anchor="middle" font-size="15" fill="#46566b">zₜ: Gaussian in V1</text>
    <text x="406" y="190" text-anchor="middle" font-size="15" fill="#46566b">categorical in V2/V3</text>

    <rect x="566" y="79" width="210" height="132" rx="12" fill="#fff1dd" stroke="#c8791a" stroke-width="2"/>
    <text x="671" y="130" text-anchor="middle" font-size="18" font-weight="650">Imagination</text>
    <text x="671" y="160" text-anchor="middle" font-size="15" fill="#46566b">actor actions → predicted</text>
    <text x="671" y="183" text-anchor="middle" font-size="15" fill="#46566b">states, rewards</text>

    <rect x="831" y="79" width="213" height="132" rx="12" fill="#e8f5ec" stroke="#328554" stroke-width="2"/>
    <text x="937.5" y="130" text-anchor="middle" font-size="18" font-weight="650">Policy learning</text>
    <text x="937.5" y="162" text-anchor="middle" font-size="15" fill="#46566b">critic estimates returns</text>

    <path d="M246 145H292" stroke="#52677f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M511 145H557" stroke="#52677f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M776 145H822" stroke="#52677f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  </g>
</svg>
